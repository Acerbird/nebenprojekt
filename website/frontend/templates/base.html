<!doctype html>
<html lang="de">
<head>

  <title>Energiewende — {{ title if title else 'Start' }}</title>

  <link href="/static/css/style.css" rel="stylesheet">

  <script src="https://cdn.plot.ly/plotly-2.25.0.min.js"></script>
</head>
<body>
  <div class="container">
    <header>

        <div class="logo">⚡</div>

        </div>

      <nav>
        <a href="/">Home</a>

        <a href="#">Stromsystem</a>
        <a href="#">Erneuerbare</a>

    <main>

    <footer>
      <div>© Energiewende — Demo 2025</div>
      <div class="muted">Quelle: Demo-Daten • Forschungsprojekt</div>
